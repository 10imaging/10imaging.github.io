<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10 Imaging Inc.</title>
  <meta name="description" content="Context Aware Computing">
  <link rel="shortcut icon" type="image/icon" href="assets/images/favicon.ico"/>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #0a0d12;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
    }

    .logo {
      width: 120px;
      opacity: 0.85;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.15));
      animation: fadeIn 1.8s ease both;
    }

    .message {
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      font-size: clamp(1.4rem, 4vw, 2.6rem);
      letter-spacing: 0.12em;
      color: #e8edf5;
      text-shadow: 0 0 30px rgba(180, 210, 255, 0.35);
      animation: fadeIn 2.4s ease both;
    }

    .dots {
      display: inline-block;
      animation: blink 1.4s steps(3, end) infinite;
      width: 1.5em;
      text-align: left;
      vertical-align: bottom;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%   { content: ''; }
      0%   { clip-path: inset(0 100% 0 0); }
    }
  </style>
</head>
<body>

<canvas id="snow"></canvas>

<div class="stage">
  <img class="logo" src="assets/images/logo-large.png" alt="10 Imaging" onerror="this.style.display='none'">
  <p class="message">Retooling in progress<span class="dots" id="dots"></span></p>
</div>

<script>
  // --- animated ellipsis ---
  (function() {
    const el = document.getElementById('dots');
    const states = ['.', '..', '...'];
    let i = 0;
    setInterval(() => { el.textContent = states[i = (i + 1) % states.length]; }, 500);
  })();

  // --- snow ---
  (function() {
    const canvas = document.getElementById('snow');
    const ctx = canvas.getContext('2d');
    let W, H, flakes;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function makeFlake() {
      const r = Math.random() * 3 + 0.6;        // radius 0.6–3.6 px
      const speed = Math.random() * 1.2 + 0.3;  // fall speed 0.3–1.5 px/frame
      const drift = (Math.random() - 0.5) * 0.4; // horizontal drift
      const opacity = Math.random() * 0.55 + 0.15;
      const wobble = Math.random() * Math.PI * 2;
      const wobbleSpeed = Math.random() * 0.025 + 0.005;
      const wobbleAmp = Math.random() * 1.2 + 0.3;
      return {
        x: Math.random() * (W || window.innerWidth),
        y: Math.random() * (H || window.innerHeight),
        r, speed, drift, opacity, wobble, wobbleSpeed, wobbleAmp
      };
    }

    function init() {
      resize();
      const count = Math.floor((W * H) / 2500);  // density scales with viewport
      flakes = Array.from({ length: count }, makeFlake);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      for (const f of flakes) {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(210, 230, 255, ${f.opacity})`;
        ctx.fill();

        f.wobble += f.wobbleSpeed;
        f.x += f.drift + Math.sin(f.wobble) * f.wobbleAmp;
        f.y += f.speed;

        if (f.y > H + 4) {
          f.y = -4;
          f.x = Math.random() * W;
        }
        if (f.x < -4)  f.x = W + 4;
        if (f.x > W + 4) f.x = -4;
      }
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); init(); });
    init();
    draw();
  })();
</script>
